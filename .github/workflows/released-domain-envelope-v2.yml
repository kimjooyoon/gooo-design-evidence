name: Released-domain envelope v2 adoption candidate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  released-domain-envelope-v2:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Observe Go runtime
        uses: actions/setup-go@v6
        with:
          go-version: '1.27.x'
          check-latest: true

      - name: Record Go version and module-root observation
        shell: bash
        run: |
          set -euo pipefail
          go_version=$(go version)
          module_roots=$(find "$GITHUB_WORKSPACE" -path "$GITHUB_WORKSPACE/.git" -prune -o -type f -name go.mod -print | wc -l | tr -d ' ')
          jq -S -n --arg go_version "$go_version" --argjson module_roots "$module_roots" \
            '{schema:"gooo/design-evidence/go-runtime-observation/v2",go_version:$go_version,module_roots:$module_roots,go_fix_module_roots:0}' \
            > "$RUNNER_TEMP/go-runtime-observation.json"

      - name: Bind candidate subject
        shell: bash
        run: |
          set -euo pipefail
          echo "SUBJECT_SHA=${{ github.event.pull_request.head.sha || github.sha }}" >> "$GITHUB_ENV"

      - name: Acquire immutable releases and read-only consumer kit
        shell: bash
        run: |
          set -euo pipefail
          lock=contracts/released-domain-envelope-adoption-release-lock-v2.json

          verify_ref() {
            local repository=$1 tag=$2 ref_type=$3 ref_sha=$4 target_sha=$5 prefix=$6
            gh api "repos/$repository/git/ref/tags/$tag" > "$RUNNER_TEMP/$prefix-ref.json"
            jq -e --arg type "$ref_type" --arg sha "$ref_sha" --arg target "$target_sha" \
              '.object.type==$type and .object.sha==$sha and .object.sha==$target' \
              "$RUNNER_TEMP/$prefix-ref.json" >/dev/null
          }

          download_release_asset() {
            local repository=$1 tag=$2 asset_id=$3 asset_name=$4 asset_size=$5 asset_sha=$6 output=$7 prefix=$8
            gh api "repos/$repository/releases/tags/$tag" > "$RUNNER_TEMP/$prefix-release.json"
            jq -e --argjson id "$asset_id" --arg name "$asset_name" --argjson size "$asset_size" \
              --arg digest "sha256:$asset_sha" \
              'any(.assets[]; .id==$id and .name==$name and .size==$size and .digest==$digest)' \
              "$RUNNER_TEMP/$prefix-release.json" >/dev/null
            gh api -H 'Accept: application/octet-stream' "repos/$repository/releases/assets/$asset_id" > "$output"
            test "$(stat -c '%s' "$output")" -eq "$asset_size"
            printf '%s  %s\n' "$asset_sha" "$output" | sha256sum -c -
          }

          core_repo=$(jq -r .core.repository "$lock")
          core_tag=$(jq -r .core.tag "$lock")
          core_ref_type=$(jq -r .core.ref_object_type "$lock")
          core_ref_sha=$(jq -r .core.ref_object_sha "$lock")
          core_target=$(jq -r .core.target_commit_sha "$lock")
          verify_ref "$core_repo" "$core_tag" "$core_ref_type" "$core_ref_sha" "$core_target" core
          core_id=$(jq -r .core.asset.id "$lock")
          core_name=$(jq -r .core.asset.name "$lock")
          core_size=$(jq -r .core.asset.size "$lock")
          core_sha=$(jq -r .core.asset.sha256 "$lock")
          download_release_asset "$core_repo" "$core_tag" "$core_id" "$core_name" "$core_size" "$core_sha" "$RUNNER_TEMP/$core_name" core
          mkdir -p "$RUNNER_TEMP/core"
          tar -xzf "$RUNNER_TEMP/$core_name" -C "$RUNNER_TEMP/core"
          chmod +x "$RUNNER_TEMP/core/gooo"
          "$RUNNER_TEMP/core/gooo" version --json > "$RUNNER_TEMP/core-version.json"

          spec_repo=$(jq -r .specification.repository "$lock")
          spec_tag=$(jq -r .specification.tag "$lock")
          spec_ref_type=$(jq -r .specification.ref_object_type "$lock")
          spec_ref_sha=$(jq -r .specification.ref_object_sha "$lock")
          spec_target=$(jq -r .specification.target_commit_sha "$lock")
          verify_ref "$spec_repo" "$spec_tag" "$spec_ref_type" "$spec_ref_sha" "$spec_target" specification
          kit_id=$(jq -r .specification.consumer_kit.id "$lock")
          kit_name=$(jq -r .specification.consumer_kit.name "$lock")
          kit_size=$(jq -r .specification.consumer_kit.size "$lock")
          kit_sha=$(jq -r .specification.consumer_kit.sha256 "$lock")
          download_release_asset "$spec_repo" "$spec_tag" "$kit_id" "$kit_name" "$kit_size" "$kit_sha" "$RUNNER_TEMP/$kit_name" consumer-kit
          mkdir -p "$RUNNER_TEMP/consumer-kit"
          tar -xzf "$RUNNER_TEMP/$kit_name" -C "$RUNNER_TEMP/consumer-kit"
          kit_root="$RUNNER_TEMP/consumer-kit/consumer-kit-v2"
          (cd "$kit_root" && sha256sum -c SHA256SUMS)
          jq -e '.schema=="gooo/interchange/released-domain-consumer-kit-manifest/v2" and .kit_version=="v2" and .authority=={cross_project_required_gates:0,product_generation_authorized:false,read_only:true,repository_checkout_required:false} and .inventory.generators==0 and .inventory.conformers==1 and .inventory.schemas==6' "$kit_root/manifest.json" >/dev/null
          test ! -e "$kit_root/../gooo-interchange-spec"

          design_repo=$(jq -r .design_evidence.repository "$lock")
          design_tag=$(jq -r .design_evidence.tag "$lock")
          design_ref_type=$(jq -r .design_evidence.ref_object_type "$lock")
          design_ref_sha=$(jq -r .design_evidence.ref_object_sha "$lock")
          design_target=$(jq -r .design_evidence.target_commit_sha "$lock")
          verify_ref "$design_repo" "$design_tag" "$design_ref_type" "$design_ref_sha" "$design_target" design-evidence
          design_id=$(jq -r .design_evidence.source_asset.id "$lock")
          design_name=$(jq -r .design_evidence.source_asset.name "$lock")
          design_size=$(jq -r .design_evidence.source_asset.size "$lock")
          design_sha=$(jq -r .design_evidence.source_asset.sha256 "$lock")
          download_release_asset "$design_repo" "$design_tag" "$design_id" "$design_name" "$design_size" "$design_sha" "$RUNNER_TEMP/$design_name" design-evidence
          mkdir -p "$RUNNER_TEMP/design-evidence"
          unzip -q "$RUNNER_TEMP/$design_name" -d "$RUNNER_TEMP/design-evidence"
          source_member=$(jq -r .design_evidence.source_asset.member "$lock")
          replay_member=$(jq -r .design_evidence.replay_asset.member "$lock")
          source_file=$(find "$RUNNER_TEMP/design-evidence" -type f -name "$source_member" -print -quit)
          replay_file=$(find "$RUNNER_TEMP/design-evidence" -type f -name "$replay_member" -print -quit)
          test -f "$source_file" && test -f "$replay_file"

          jq -S -n --arg core_tag "$core_tag" --arg core_target "$core_target" --arg core_sha "$core_sha" \
            --arg spec_tag "$spec_tag" --arg spec_target "$spec_target" --arg kit_sha "$kit_sha" \
            --arg design_tag "$design_tag" --arg design_target "$design_target" --arg design_sha "$design_sha" \
            '{schema:"gooo/design-evidence/released-domain-envelope-immutable-inputs/v2",core:{tag:$core_tag,target_commit_sha:$core_target,asset_sha256:$core_sha,identity_verified:true},specification:{tag:$spec_tag,target_commit_sha:$spec_target,consumer_kit_asset_sha256:$kit_sha,identity_verified:true},design_evidence:{tag:$design_tag,target_commit_sha:$design_target,source_asset_sha256:$design_sha,identity_verified:true}}' > "$RUNNER_TEMP/immutable-inputs.json"

      - name: Resolve twelve Gooo meta activities
        shell: bash
        run: |
          set -euo pipefail
          gooo="$RUNNER_TEMP/core/gooo"
          source=examples/released-domain-envelope-v2/main.gooo
          denominator=contracts/released-domain-envelope-denominator-v2.json
          jq -e '. as $d | ($d.schema=="gooo/design-evidence/released-domain-envelope-adoption-denominator/v2") and ($d.target_cells==12) and (([$d.cells[].id]|sort)==["AUTHORITY_BOUNDARY","CLAIM_DISPOSITION_SOURCE","CORE_RELEASE","DESIGN_RELEASE","DETERMINISTIC_REPLAY","EIGHT_FILE_ENVELOPE","META_ACTIVITY_AUTHORITY","PRODUCT_PROJECTION","READ_ONLY_CONFORMANCE","REFUTED_COUNTEREXAMPLES","SPEC_RELEASE","UNKNOWN_CAUSALITY"]) and (([$d.cells[].activity]|unique|length)==12) and (all(["FOUNDATION","COHERENCE","REGRESSION"][]; . as $choice | ([$d.cells[]|select(.proof_choice==$choice)]|length)==4)) and (all(["DRIVER","OUTCOME","GUARDRAIL"][]; . as $class | ([$d.cells[]|select(.indicator_class==$class)]|length)==4))' "$denominator" >/dev/null
          "$gooo" check --json "$source" > "$RUNNER_TEMP/envelope-syntax.json"
          "$gooo" check --semantic --json "$source" > "$RUNNER_TEMP/envelope-semantic.json"
          "$gooo" graph dump "$source" > "$RUNNER_TEMP/envelope-graph.json"
          jq -e '.status=="ok"' "$RUNNER_TEMP/envelope-syntax.json" "$RUNNER_TEMP/envelope-semantic.json" >/dev/null
          jq -e '([.nodes[]|select(.kind=="Activity")]|length)==12 and ([.nodes[]|select(.kind=="Activity")|.name]|unique|length)==12' "$RUNNER_TEMP/envelope-graph.json" >/dev/null
          mkdir -p "$RUNNER_TEMP/envelope-core-resolutions"
          while IFS=$'\t' read -r ordinal activity; do
            printf -v receipt '%s/envelope-core-resolutions/%02d-%s.json' "$RUNNER_TEMP" "$ordinal" "$activity"
            "$gooo" graph resolve-activity "$source" --name "$activity" > "$receipt"
            jq -e --arg activity "$activity" '.schema=="gooo/activity-cardinality-resolution/v1" and .selector.name==$activity and .decision=="CLOSED" and .occurrences==1 and .claim.state=="CLOSED" and .claim.reason=="ACTIVITY_UNIQUELY_RESOLVED"' "$receipt" >/dev/null
          done < <(jq -r '.cells[]|[.ordinal,.activity]|@tsv' "$denominator")
          jq -S -s '.' "$RUNNER_TEMP"/envelope-core-resolutions/*.json > "$RUNNER_TEMP/envelope-core-receipts.json"

      - name: Generate, conform, replay, and challenge the product projection
        shell: bash
        run: |
          set -euo pipefail
          lock=contracts/released-domain-envelope-adoption-release-lock-v2.json
          denominator=contracts/released-domain-envelope-denominator-v2.json
          fixture=fixtures/released-domain-envelope-adoption-v2.json
          exporter=scripts/export-released-domain-envelope-v2.sh
          conformer="$RUNNER_TEMP/consumer-kit/consumer-kit-v2/scripts/conform-released-envelope-v2.sh"
          expected_envelope_files=$(jq -r .artifact_contract.outputs.envelope_files "$fixture")
          expected_unknown_cases=$(jq -r .artifact_contract.unknown_cases "$fixture")
          expected_unknown_coordinate_fields=$(jq -r .artifact_contract.unknown_coordinate_fields "$fixture")
          expected_direct_missing=$(jq -r .artifact_contract.unknown_classes.direct_missing "$fixture")
          expected_dependency_blocked=$(jq -r .artifact_contract.unknown_classes.dependency_blocked "$fixture")
          expected_refuted_cases=$(jq -r .artifact_contract.refuted_cases "$fixture")
          expected_claim_tuples=$(jq -r .source.expected_claim_tuples "$fixture")
          source_file=$(find "$RUNNER_TEMP/design-evidence" -type f -name "$(jq -r .design_evidence.source_asset.member "$lock")" -print -quit)
          replay_file=$(find "$RUNNER_TEMP/design-evidence" -type f -name "$(jq -r .design_evidence.replay_asset.member "$lock")" -print -quit)
          snapshot() {
            find "$GITHUB_WORKSPACE" -path "$GITHUB_WORKSPACE/.git" -prune -o -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | awk '{print $1}'
          }
          before=$(snapshot)
          start_ns=$(date +%s%N)
          /usr/bin/time -f '%M' -o "$RUNNER_TEMP/envelope-exporter-rss" bash "$exporter" "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/$lock" "$GITHUB_WORKSPACE/$denominator" "$GITHUB_WORKSPACE/$fixture" "$RUNNER_TEMP/envelope-core-receipts.json" "$source_file" "$replay_file" "$RUNNER_TEMP/envelope-a"
          end_ns=$(date +%s%N)
          echo $(( (end_ns-start_ns)/1000000 )) > "$RUNNER_TEMP/envelope-exporter-wall-ms"
          bash "$exporter" "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/$lock" "$GITHUB_WORKSPACE/$denominator" "$GITHUB_WORKSPACE/$fixture" "$RUNNER_TEMP/envelope-core-receipts.json" "$source_file" "$replay_file" "$RUNNER_TEMP/envelope-b"
          bash "$conformer" "$RUNNER_TEMP/envelope-a" "$RUNNER_TEMP/envelope-b" "$RUNNER_TEMP/envelope-conformance.json"
          envelope_file_count=$(find "$RUNNER_TEMP/envelope-a" -mindepth 1 -maxdepth 1 -type f | wc -l | tr -d ' ')
          conformer_files=$(jq -r .summary.files "$RUNNER_TEMP/envelope-conformance.json")
          conformer_checks_total=$(jq '.checks|length' "$RUNNER_TEMP/envelope-conformance.json")
          conformer_checks_closed=$(jq '[.checks[]|select(.state=="CLOSED")]|length' "$RUNNER_TEMP/envelope-conformance.json")
          deterministic_replay_closed=$(jq '[.checks[]|select(.id=="DETERMINISTIC_REPLAY" and .state=="CLOSED")]|length' "$RUNNER_TEMP/envelope-conformance.json")
          test "$envelope_file_count" -eq "$expected_envelope_files"
          test "$envelope_file_count" -eq "$conformer_files"
          jq -e --argjson expected_files "$expected_envelope_files" --argjson expected_relations "$(jq -r .source.expected_relations "$fixture")" --argjson expected_checks "$conformer_checks_total" \
            '.decision=="CONFORMANT" and .summary.files==$expected_files and .summary.relations==$expected_relations and .summary.evidence==$expected_relations and .summary.resolutions==$expected_relations and .summary.closed==$expected_checks and .summary.total==$expected_checks and .summary.unknown==0 and .summary.unknowns==0 and .summary.refuted==0' \
            "$RUNNER_TEMP/envelope-conformance.json" >/dev/null

          cp -R "$RUNNER_TEMP/envelope-a" "$RUNNER_TEMP/envelope-valid-unknown-a"
          cp -R "$RUNNER_TEMP/envelope-a" "$RUNNER_TEMP/envelope-valid-unknown-b"
          for bundle in "$RUNNER_TEMP/envelope-valid-unknown-a" "$RUNNER_TEMP/envelope-valid-unknown-b"; do
            jq --argjson unknown_cases "$expected_unknown_cases" '.unknown_count=$unknown_cases' "$bundle/project.json" > "$bundle/project.next"
            mv "$bundle/project.next" "$bundle/project.json"
            jq -cS 'if .relation_id=="action-token-used-by-button" then .state="UNKNOWN"|.stage="RELATION"|.step="RESOLVE_DESIGN_CODE_RELATION"|.reason="CODE_CONNECT_PROPERTY_UNAVAILABLE"|.unknown_class="DIRECT_MISSING"|.next_operation="PROVIDE_CODE_CONNECT_PROPERTY"|.blocked_by=[] elif .relation_id=="figma-disabled-implemented-by-code" then .state="UNKNOWN"|.stage="RELATION"|.step="RESOLVE_DESIGN_CODE_RELATION"|.reason="DEPENDENCY_EVIDENCE_UNAVAILABLE"|.unknown_class="DEPENDENCY_BLOCKED"|.next_operation="RESOLVE_DEPENDENCY_FRONTIER"|.blocked_by=["action-token-used-by-button"] else . end' "$bundle/resolutions.ndjson" > "$bundle/resolutions.next"
            mv "$bundle/resolutions.next" "$bundle/resolutions.ndjson"
            jq -cS 'select(.state=="UNKNOWN")' "$bundle/resolutions.ndjson" > "$bundle/unknowns.ndjson"
            payload_sha=$(cd "$bundle" && sha256sum project.json evidence.ndjson relations.ndjson resolutions.ndjson unknowns.ndjson conformance.json | sha256sum | awk '{print $1}')
            jq --arg payload_sha "$payload_sha" '.projection.payload_sha256=$payload_sha' "$bundle/replay.json" > "$bundle/replay.next"
            mv "$bundle/replay.next" "$bundle/replay.json"
            (cd "$bundle" && sha256sum project.json evidence.ndjson relations.ndjson resolutions.ndjson unknowns.ndjson conformance.json replay.json > checksums.txt)
          done
          bash "$conformer" "$RUNNER_TEMP/envelope-valid-unknown-a" "$RUNNER_TEMP/envelope-valid-unknown-b" "$RUNNER_TEMP/envelope-unknown-conformance.json"
          unknown_record_count=$(jq -s 'length' "$RUNNER_TEMP/envelope-valid-unknown-a/unknowns.ndjson")
          unknown_coordinate_fields=$(jq -s 'if length==0 then 0 elif all(.[]; has("stage") and has("step") and has("reason") and has("unknown_class") and has("next_operation") and has("blocked_by") and (.blocked_by|type)=="array") then 6 else ([.[] | [has("stage"),has("step"),has("reason"),has("unknown_class"),has("next_operation"),has("blocked_by")] | map(select(.==true)) | length] | min) end' "$RUNNER_TEMP/envelope-valid-unknown-a/unknowns.ndjson")
          unknown_direct_missing=$(jq -s '[.[]|select(.unknown_class=="DIRECT_MISSING")]|length' "$RUNNER_TEMP/envelope-valid-unknown-a/unknowns.ndjson")
          unknown_dependency_blocked=$(jq -s '[.[]|select(.unknown_class=="DEPENDENCY_BLOCKED")]|length' "$RUNNER_TEMP/envelope-valid-unknown-a/unknowns.ndjson")
          jq -e --argjson expected_files "$expected_envelope_files" --argjson expected_relations "$(jq -r .source.expected_relations "$fixture")" --argjson expected_unknowns "$expected_unknown_cases" \
            '.decision=="CONFORMANT" and .summary.files==$expected_files and .summary.relations==$expected_relations and .summary.evidence==$expected_relations and .summary.resolutions==$expected_relations and .summary.unknowns==$expected_unknowns' \
            "$RUNNER_TEMP/envelope-unknown-conformance.json" >/dev/null

          cp -R "$RUNNER_TEMP/envelope-a" "$RUNNER_TEMP/envelope-counterexample-01"
          : > "$RUNNER_TEMP/envelope-counterexample-01/extra.txt"
          bash "$conformer" "$RUNNER_TEMP/envelope-counterexample-01" "$RUNNER_TEMP/envelope-counterexample-01" "$RUNNER_TEMP/envelope-counterexample-01.json"

          cp -R "$RUNNER_TEMP/envelope-a" "$RUNNER_TEMP/envelope-counterexample-02"
          jq '.authority.product_generation_authorized=true' "$RUNNER_TEMP/envelope-counterexample-02/project.json" > "$RUNNER_TEMP/envelope-counterexample-02/project.next"
          mv "$RUNNER_TEMP/envelope-counterexample-02/project.next" "$RUNNER_TEMP/envelope-counterexample-02/project.json"
          bash "$conformer" "$RUNNER_TEMP/envelope-counterexample-02" "$RUNNER_TEMP/envelope-counterexample-02" "$RUNNER_TEMP/envelope-counterexample-02.json"

          cp -R "$RUNNER_TEMP/envelope-a" "$RUNNER_TEMP/envelope-counterexample-03"
          jq '.relation_count=3' "$RUNNER_TEMP/envelope-counterexample-03/project.json" > "$RUNNER_TEMP/envelope-counterexample-03/project.next"
          mv "$RUNNER_TEMP/envelope-counterexample-03/project.next" "$RUNNER_TEMP/envelope-counterexample-03/project.json"
          bash "$conformer" "$RUNNER_TEMP/envelope-counterexample-03" "$RUNNER_TEMP/envelope-counterexample-03" "$RUNNER_TEMP/envelope-counterexample-03.json"

          cp -R "$RUNNER_TEMP/envelope-a" "$RUNNER_TEMP/envelope-counterexample-04"
          jq 'if .relation_id=="action-token-used-by-button" then .unknown_class=null|.next_operation="NONE" else . end' "$RUNNER_TEMP/envelope-counterexample-04/resolutions.ndjson" > "$RUNNER_TEMP/envelope-counterexample-04/resolutions.next"
          mv "$RUNNER_TEMP/envelope-counterexample-04/resolutions.next" "$RUNNER_TEMP/envelope-counterexample-04/resolutions.ndjson"
          bash "$conformer" "$RUNNER_TEMP/envelope-counterexample-04" "$RUNNER_TEMP/envelope-counterexample-04" "$RUNNER_TEMP/envelope-counterexample-04.json"

          cp -R "$RUNNER_TEMP/envelope-a" "$RUNNER_TEMP/envelope-counterexample-05"
          printf '\n' >> "$RUNNER_TEMP/envelope-counterexample-05/project.json"
          bash "$conformer" "$RUNNER_TEMP/envelope-counterexample-05" "$RUNNER_TEMP/envelope-counterexample-05" "$RUNNER_TEMP/envelope-counterexample-05.json"
          for counterexample in 01 02 03 04 05; do
            jq -e '.decision=="FAIL_CLOSED" and .summary.refuted>=1' "$RUNNER_TEMP/envelope-counterexample-$counterexample.json" >/dev/null
          done
          refuted_report_count=0
          refuted_fail_closed_count=0
          for report in "$RUNNER_TEMP"/envelope-counterexample-*.json; do
            test -f "$report" || continue
            refuted_report_count=$((refuted_report_count+1))
            if jq -e '.decision=="FAIL_CLOSED"' "$report" >/dev/null; then
              refuted_fail_closed_count=$((refuted_fail_closed_count+1))
            fi
          done
          test "$refuted_report_count" -eq "$expected_refuted_cases"
          test "$refuted_fail_closed_count" -eq "$refuted_report_count"

          actual_relations=$(wc -l < "$RUNNER_TEMP/envelope-a/relations.ndjson" | tr -d ' ')
          actual_evidence=$(wc -l < "$RUNNER_TEMP/envelope-a/evidence.ndjson" | tr -d ' ')
          actual_resolutions=$(wc -l < "$RUNNER_TEMP/envelope-a/resolutions.ndjson" | tr -d ' ')
          source_relations=$(jq --arg key "$(jq -r .source.relation_array "$fixture")" '.[$key]|length' "$source_file")
          source_claims=$(jq '.claim_tuples|length' "$source_file")
          project_owner=$(jq -r .projection.owner "$RUNNER_TEMP/envelope-a/project.json")
          product_projection_observed=0
          if test "$project_owner" = "DESIGN_EVIDENCE" && test -d "$RUNNER_TEMP/envelope-a"; then
            product_projection_observed=1
          fi
          core_release_observed=$(jq -r 'if .core.identity_verified==true then true else false end' "$RUNNER_TEMP/immutable-inputs.json")
          spec_release_observed=$(jq -r 'if .specification.identity_verified==true then true else false end' "$RUNNER_TEMP/immutable-inputs.json")
          design_release_observed=$(jq -r 'if .design_evidence.identity_verified==true then true else false end' "$RUNNER_TEMP/immutable-inputs.json")
          meta_activity_authority_observed=$(jq -n --slurpfile graph "$RUNNER_TEMP/envelope-graph.json" --slurpfile denominator "$GITHUB_WORKSPACE/$denominator" --slurpfile receipts "$RUNNER_TEMP/envelope-core-receipts.json" '
            if ([$graph[0].nodes[]|select(.kind=="Activity")|.name]|sort) == ([$denominator[0].cells[].activity]|sort)
               and ([$graph[0].nodes[]|select(.kind=="Activity")|.name]|unique|length)==12
               and ($receipts[0]|length)==12
               and all($receipts[0][]; .decision=="CLOSED" and .occurrences==1 and .claim.state=="CLOSED")
            then true else false end')
          release_assets_observed=0
          for asset in "$(jq -r .core.asset.name "$lock")" "$(jq -r .specification.consumer_kit.name "$lock")" "$(jq -r .design_evidence.source_asset.name "$lock")"; do
            if test -f "$RUNNER_TEMP/$asset"; then
              release_assets_observed=$((release_assets_observed+1))
            fi
          done
          repository_inputs_observed=0
          for input in "$lock" "$denominator" "$fixture"; do
            if test -f "$GITHUB_WORKSPACE/$input"; then
              repository_inputs_observed=$((repository_inputs_observed+1))
            fi
          done
          input_artifacts_observed=$((release_assets_observed+repository_inputs_observed))
          conformer_decision=$(jq -r .decision "$RUNNER_TEMP/envelope-conformance.json")
          normal_case_observed=0
          if test "$conformer_decision" = "CONFORMANT" && test "$(jq -r .summary.unknown "$RUNNER_TEMP/envelope-conformance.json")" -eq 0 && test "$(jq -r .summary.refuted "$RUNNER_TEMP/envelope-conformance.json")" -eq 0; then
            normal_case_observed=1
          fi

          after=$(snapshot)
          if test "$before" = "$after"; then writes=0; else writes=1; fi
          go_files=$(find "$GITHUB_WORKSPACE" -path "$GITHUB_WORKSPACE/.git" -prune -o -type f -name '*.go' -print | wc -l | tr -d ' ')
          gooo_files=$(find "$GITHUB_WORKSPACE" -path "$GITHUB_WORKSPACE/.git" -prune -o -type f -name '*.gooo' -print | wc -l | tr -d ' ')
          go_lines=$(find "$GITHUB_WORKSPACE" -path "$GITHUB_WORKSPACE/.git" -prune -o -type f -name '*.go' -exec wc -l {} + | awk '{sum += $1} END {print sum+0}')
          gooo_lines=$(find "$GITHUB_WORKSPACE" -path "$GITHUB_WORKSPACE/.git" -prune -o -type f -name '*.gooo' -exec wc -l {} + | awk '{sum += $1} END {print sum+0}')
          inventory_files=$(find "$GITHUB_WORKSPACE" \( -path "$GITHUB_WORKSPACE/.git" -o -path "$GITHUB_WORKSPACE/README.md" \) -prune -o -type f -print)
          descendant_directories=$(find "$GITHUB_WORKSPACE" -mindepth 1 -type d -not -path "$GITHUB_WORKSPACE/.git" -not -path "$GITHUB_WORKSPACE/.git/*" | wc -l | tr -d ' ')
          general_files=$(printf '%s\n' "$inventory_files" | awk 'NF && $0 !~ /\.gooo$/ && $0 !~ /\.go$/ {n++} END {print n+0}')
          physical_lines=$(printf '%s\n' "$inventory_files" | xargs wc -l | awk 'END {print $1+0}')
          jq -S -n --arg subject_sha "$SUBJECT_SHA" --arg before "$before" --arg after "$after" \
            --argjson writes "$writes" --argjson peak_rss_kib "$(cat "$RUNNER_TEMP/envelope-exporter-rss")" --argjson wall_ms "$(cat "$RUNNER_TEMP/envelope-exporter-wall-ms")" \
            --argjson go_files "$go_files" --argjson go_lines "$go_lines" --argjson gooo_files "$gooo_files" --argjson gooo_lines "$gooo_lines" \
            --argjson descendant_directories "$descendant_directories" --argjson general_files "$general_files" --argjson physical_lines "$physical_lines" \
            --slurpfile go_observation "$RUNNER_TEMP/go-runtime-observation.json" \
            '{schema:"gooo/design-evidence/released-domain-envelope-runtime/v2",subject_sha:$subject_sha,repository:{before_digest:$before,after_digest:$after,writes:$writes},local_test_executions:0,cross_project_required_gates:0,product_generation_authorized:false,go_version:$go_observation[0].go_version,module_roots:$go_observation[0].module_roots,go_fix_module_roots:$go_observation[0].go_fix_module_roots,exporter:{peak_rss_kib:$peak_rss_kib,wall_ms:$wall_ms,output_owner:"CALLER_OWNED_TEMP"},inventory:{root_readme_excluded:true,go:{files:$go_files,physical_lines:$go_lines},gooo:{files:$gooo_files,physical_lines:$gooo_lines},descendant_directories:$descendant_directories,general_files:$general_files,physical_lines:$physical_lines}}' > "$RUNNER_TEMP/envelope-runtime.json"

          adoption_json=$(jq -c .adoption "$fixture")
          improvement_json=$(jq -c .improvement "$fixture")
          jq -S -n --slurpfile project "$RUNNER_TEMP/envelope-a/project.json" --slurpfile source "$source_file" --slurpfile conformance "$RUNNER_TEMP/envelope-conformance.json" --slurpfile runtime "$RUNNER_TEMP/envelope-runtime.json" \
            --argjson adoption "$adoption_json" --argjson improvement "$improvement_json" \
            --argjson expected_envelope_files "$expected_envelope_files" --argjson expected_relations "$(jq -r .source.expected_relations "$fixture")" \
            --argjson expected_unknown_cases "$expected_unknown_cases" --argjson expected_unknown_coordinate_fields "$expected_unknown_coordinate_fields" \
            --argjson expected_direct_missing "$expected_direct_missing" --argjson expected_dependency_blocked "$expected_dependency_blocked" \
            --argjson expected_refuted_cases "$expected_refuted_cases" --argjson expected_normal_cases "$(jq -r .artifact_contract.normal_cases "$fixture")" \
            --argjson expected_input_assets "$(jq -r .artifact_contract.inputs.release_assets "$fixture")" --argjson expected_input_repo "$(jq -r .artifact_contract.inputs.repository_inputs "$fixture")" \
            --argjson expected_input_total "$(jq -r .artifact_contract.inputs.total "$fixture")" --argjson product_projection_observed "$product_projection_observed" \
            --argjson actual_relations "$actual_relations" --argjson actual_evidence "$actual_evidence" --argjson actual_resolutions "$actual_resolutions" \
            --argjson source_relations "$source_relations" --argjson source_claims "$source_claims" --argjson expected_claim_tuples "$expected_claim_tuples" --argjson input_artifacts_observed "$input_artifacts_observed" \
            --argjson release_assets_observed "$release_assets_observed" --argjson repository_inputs_observed "$repository_inputs_observed" \
            --argjson unknown_record_count "$unknown_record_count" --argjson unknown_coordinate_fields "$unknown_coordinate_fields" \
            --argjson unknown_direct_missing "$unknown_direct_missing" --argjson unknown_dependency_blocked "$unknown_dependency_blocked" \
            --argjson refuted_report_count "$refuted_report_count" --argjson refuted_fail_closed_count "$refuted_fail_closed_count" \
            --argjson normal_case_observed "$normal_case_observed" --argjson core_release_observed "$core_release_observed" \
            --argjson spec_release_observed "$spec_release_observed" --argjson design_release_observed "$design_release_observed" \
            --argjson meta_activity_authority_observed "$meta_activity_authority_observed" --argjson envelope_file_count "$envelope_file_count" \
            --argjson conformer_files "$conformer_files" --argjson conformer_checks_total "$conformer_checks_total" \
            --argjson conformer_checks_closed "$conformer_checks_closed" --argjson deterministic_replay_closed "$deterministic_replay_closed" \
            --arg conformer_decision "$conformer_decision" \
            '{schema:"gooo/design-evidence/released-domain-envelope-facts/v2",projection:{product_owned_projection:{observed:$product_projection_observed,total:1},envelope_files:{observed:$envelope_file_count,total:$expected_envelope_files,conformer_summary_files:$conformer_files},relations:{observed:$actual_relations,total:$expected_relations},evidence:{observed:$actual_evidence,total:$expected_relations},resolutions:{observed:$actual_resolutions,total:$expected_relations},conformer_checks:{observed:$conformer_checks_closed,total:$conformer_checks_total},conformer_decision:$conformer_decision,deterministic_replay:{observed:$deterministic_replay_closed,total:1}},source:{claim_disposition_tuples:{observed:$source_claims,total:$expected_claim_tuples},relation_dispositions:{observed:$source_relations,total:$expected_relations},known_contradiction:{observed:(if any($source[0].claim_tuples[];.claim.state=="REFUTED") then 1 else 0 end),total:1,state:(if any($source[0].claim_tuples[];.claim.state=="REFUTED") then "REFUTED" else "UNKNOWN" end),precedence:"REFUTED_OVER_UNKNOWN"}},unknown_cases:{valid:{observed:$unknown_record_count,total:$expected_unknown_cases},coordinate_fields_observed:$unknown_coordinate_fields,coordinate_fields_total:$expected_unknown_coordinate_fields,classes:{direct_missing:{observed:$unknown_direct_missing,total:$expected_direct_missing},dependency_blocked:{observed:$unknown_dependency_blocked,total:$expected_dependency_blocked}}},refuted_cases:{observed:$refuted_fail_closed_count,total:$expected_refuted_cases,report_count:$refuted_report_count,minimum_cases:$expected_refuted_cases,all_fail_closed:($refuted_report_count==$expected_refuted_cases and $refuted_fail_closed_count==$refuted_report_count)},normal_cases:{observed:$normal_case_observed,total:$expected_normal_cases,minimum_cases:$expected_normal_cases,state:"CLOSED"},artifacts:{inputs:{observed:$input_artifacts_observed,total:$expected_input_total,release_assets:{observed:$release_assets_observed,total:$expected_input_assets},repository_inputs:{observed:$repository_inputs_observed,total:$expected_input_repo}},outputs:{observed:$envelope_file_count,total:$expected_envelope_files,envelope_files:$envelope_file_count}},observations:{core_release:$core_release_observed,spec_release:$spec_release_observed,design_release:$design_release_observed,meta_activity_authority:$meta_activity_authority_observed},adoption:$adoption,improvement:$improvement,runtime:$runtime[0]}' > "$RUNNER_TEMP/envelope-facts.json"

          bash scripts/evaluate-released-domain-envelope-v2.sh "$GITHUB_WORKSPACE" "$RUNNER_TEMP/envelope-core-receipts.json" "$RUNNER_TEMP/envelope-facts.json" "$RUNNER_TEMP/envelope-adoption-report.json" "$SUBJECT_SHA"
          jq -e '.decision=="ADOPTION_CANDIDATE_CONFORMANT" and .summary.total==12 and .summary.closed==12 and .summary.unknown==0 and .summary.refuted==0 and .summary.product_owned_projection.observed==1 and .summary.product_owned_projection.total==1 and .summary.envelope_files.observed==8 and .summary.envelope_files.total==8 and .summary.relations=={observed:4,total:4} and .summary.evidence=={observed:4,total:4} and .summary.resolutions=={observed:4,total:4} and .summary.conformer_checks=={observed:10,total:10} and .summary.deterministic_replay=={observed:1,total:1} and ([.proofs[]|select(.closed==4 and .total==4)]|length)==3 and ([.indicator_classes[]|select(.closed==4 and .total==4)]|length)==3 and .adoption.released.observed==0 and .adoption.released.total==1 and .adoption.released.state=="UNKNOWN" and .adoption.external_utility.observed==0 and .adoption.external_utility.total==1 and .adoption.external_utility.state=="UNKNOWN" and .improvement.state=="UNKNOWN" and .authority.cross_project_required_gates==0 and .authority.repository_writes==0 and .runtime.local_test_executions==0' "$RUNNER_TEMP/envelope-adoption-report.json" >/dev/null

          jq '.[0].decision="FIXED_POINT"' "$RUNNER_TEMP/envelope-core-receipts.json" > "$RUNNER_TEMP/envelope-invalid-core-receipts.json"
          bash scripts/evaluate-released-domain-envelope-v2.sh "$GITHUB_WORKSPACE" "$RUNNER_TEMP/envelope-invalid-core-receipts.json" "$RUNNER_TEMP/envelope-facts.json" "$RUNNER_TEMP/envelope-invalid-core-report.json" "$SUBJECT_SHA"
          jq -e '.decision=="FAIL_CLOSED" and .summary.closed==0 and .summary.refuted==12 and .claim.stage=="RESOLUTION" and .claim.step=="RESOLVE_ACTIVITY_CARDINALITY" and .claim.reason=="UNRECOGNIZED_CORE_ACTIVITY_RESOLUTION_DECISION"' "$RUNNER_TEMP/envelope-invalid-core-report.json" >/dev/null

          jq '.[0] |= (.decision="UNKNOWN" | .occurrences=0 | .claim.state="UNKNOWN" | .claim.reason="ACTIVITY_NOT_FOUND")' "$RUNNER_TEMP/envelope-core-receipts.json" > "$RUNNER_TEMP/envelope-valid-unknown-core-receipts.json"
          bash scripts/evaluate-released-domain-envelope-v2.sh "$GITHUB_WORKSPACE" "$RUNNER_TEMP/envelope-valid-unknown-core-receipts.json" "$RUNNER_TEMP/envelope-facts.json" "$RUNNER_TEMP/envelope-valid-unknown-core-report.json" "$SUBJECT_SHA"
          jq -e '.decision=="INCOMPLETE" and .summary.unknown>=1 and .summary.refuted==0 and .claim.state=="UNKNOWN" and .claim.reason=="ACTIVITY_NOT_FOUND" and .claim.unknown_class=="DIRECT_MISSING"' "$RUNNER_TEMP/envelope-valid-unknown-core-report.json" >/dev/null

          jq '.[0] |= (.decision="REFUTED" | .occurrences=2 | .claim.state="REFUTED" | .claim.reason="AMBIGUOUS_ACTIVITY_BINDING")' "$RUNNER_TEMP/envelope-core-receipts.json" > "$RUNNER_TEMP/envelope-valid-refuted-core-receipts.json"
          bash scripts/evaluate-released-domain-envelope-v2.sh "$GITHUB_WORKSPACE" "$RUNNER_TEMP/envelope-valid-refuted-core-receipts.json" "$RUNNER_TEMP/envelope-facts.json" "$RUNNER_TEMP/envelope-valid-refuted-core-report.json" "$SUBJECT_SHA"
          jq -e '.decision=="FAIL_CLOSED" and .summary.closed==0 and .summary.refuted==12 and .claim.state=="REFUTED" and .claim.reason=="AMBIGUOUS_ACTIVITY_BINDING"' "$RUNNER_TEMP/envelope-valid-refuted-core-report.json" >/dev/null

          jq '.[0] |= (.decision="UNKNOWN" | .occurrences=1 | .claim.state="UNKNOWN" | .claim.reason="MALFORMED_UNKNOWN")' "$RUNNER_TEMP/envelope-core-receipts.json" > "$RUNNER_TEMP/envelope-malformed-unknown-core-receipts.json"
          bash scripts/evaluate-released-domain-envelope-v2.sh "$GITHUB_WORKSPACE" "$RUNNER_TEMP/envelope-malformed-unknown-core-receipts.json" "$RUNNER_TEMP/envelope-facts.json" "$RUNNER_TEMP/envelope-malformed-unknown-core-report.json" "$SUBJECT_SHA"
          jq -e '.decision=="FAIL_CLOSED" and .summary.closed==0 and .summary.refuted==12 and .claim.reason=="UNRECOGNIZED_CORE_ACTIVITY_RESOLUTION_DECISION"' "$RUNNER_TEMP/envelope-malformed-unknown-core-report.json" >/dev/null

          {
            echo '## Released-domain envelope v2 adoption candidate'
            jq -r '"- product-owned projection: \(.summary.product_owned_projection.observed)/\(.summary.product_owned_projection.total)","- envelope files: \(.summary.envelope_files.observed)/\(.summary.envelope_files.total)","- relations/evidence/resolutions: \(.summary.relations.observed)/\(.summary.evidence.observed)/\(.summary.resolutions.observed)","- conformer checks: \(.summary.conformer_checks.observed)/\(.summary.conformer_checks.total)","- deterministic replay: \(.summary.deterministic_replay.observed)/\(.summary.deterministic_replay.total)","- meta cells: \(.summary.closed)/\(.summary.total) CLOSED","- proofs: " + ([.proofs[]|"\(.choice) \(.closed)/\(.total)"]|join(", ")),"- indicators: " + ([.indicator_classes[]|"\(.class) \(.closed)/\(.total)"]|join(", ")),"- released adoption: \(.adoption.released.observed)/\(.adoption.released.total) \(.adoption.released.state)","- external utility: \(.adoption.external_utility.observed)/\(.adoption.external_utility.total) \(.adoption.external_utility.state)","- repository writes: \(.runtime.repository.writes)","- local test executions: \(.runtime.local_test_executions)","- cross-project required gates: \(.authority.cross_project_required_gates)","- inventory: Go \(.runtime.inventory.go.files) files/\(.runtime.inventory.go.physical_lines) lines; Gooo \(.runtime.inventory.gooo.files) files/\(.runtime.inventory.gooo.physical_lines) lines; descendant directories \(.runtime.inventory.descendant_directories); general files \(.runtime.inventory.general_files)","- exporter peak RSS/wall: \(.runtime.exporter.peak_rss_kib) KiB/\(.runtime.exporter.wall_ms) ms"' "$RUNNER_TEMP/envelope-adoption-report.json"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload adoption evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: design-evidence-released-domain-envelope-v2-${{ github.event.pull_request.head.sha || github.sha }}
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/envelope-a
            ${{ runner.temp }}/envelope-b
            ${{ runner.temp }}/envelope-adoption-report.json
            ${{ runner.temp }}/envelope-invalid-core-report.json
            ${{ runner.temp }}/envelope-valid-unknown-core-report.json
            ${{ runner.temp }}/envelope-valid-refuted-core-report.json
            ${{ runner.temp }}/envelope-malformed-unknown-core-report.json
            ${{ runner.temp }}/envelope-conformance.json
            ${{ runner.temp }}/envelope-unknown-conformance.json
            ${{ runner.temp }}/envelope-counterexample-*.json
            ${{ runner.temp }}/envelope-core-receipts.json
            ${{ runner.temp }}/envelope-facts.json
            ${{ runner.temp }}/envelope-runtime.json
            ${{ runner.temp }}/immutable-inputs.json
            ${{ runner.temp }}/envelope-graph.json
